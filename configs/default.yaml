video:
  frame_step: 1            # processar 1 a cada N frames; jogo corrido (SNGS-054/040/026): step 1 reduz IDs por jogador em 20-30% vs. step 2
detection:
  model: models/yolo11n.pt
  device: auto             # auto | cpu | cuda
  classes: [0]             # COCO: 0 = person
  conf: 0.3
  min_area: 150            # px²
  imgsz: 1280              # clip01, 50 frames vs. GT (com filtro): recall 0.82 (640, 49 ms) → 0.93 (960, 53 ms) → 0.94 (1280, 129 ms; CPU)
  foot_margin: 10          # px de dilatação da máscara no teste do pé; clip01: recall 0.88 (0) → 0.94 (10), precisão 0.94 nos dois (sem filtro: 0.87)
# clip01 vs. GT (15 jogadores): padrão (1 s, 0.3, 0.8) → 44 IDs, 43 trocas, pureza 0.979;
# escolhido → 32 IDs, 32 trocas, pureza 0.979. match 0.95 dá 18 trocas mas pureza 0.923 (IDs que
# misturam jogadores estragam a votação de time; fragmentar só gera tracks curtos). step=1 foi pior em tudo.
tracking:
  activation_conf: 0.5     # conf mínima para abrir um novo ID (0.3 abria IDs para detecções ruins)
  lost_buffer_s: 3.0       # tempo que um ID perdido é mantido esperando reaparecer (1→3 s: 35→32 IDs)
  match_thresh: 0.8        # custo máximo 1-IoU na associação (ByteTrack/supervision)
  min_consecutive: 1
homography:
  mode: propagate          # manual (v1, H fixa) | propagate (v2, a partir da anotação manual)
  ransac_thresh_m: 1.0     # erro máximo (m) para um clique contar como inlier
  # modo manual: H fixa só vale com a câmera parada. clip01: erro dos pés GT sobe >0,25 m a partir do frame 576
  # (a câmera passa a acompanhar o lance); frames depois disso ficam fora do heatmap até a v2.
  valid_until_frame: 575
  # v2 (propagação): pontos no gramado, fora dos jogadores; G até o quadro-chave por RANSAC
  # clip01 vs. GT (H inicial = referência GT, erro 0.04 m): H fixa pior 13.2 m; ORB pior 2.8 m (40 ms/quadro);
  # SIFT pior 0.58 m, mediana 0.03 m (250 ms/quadro, 1080p). ORB perde no borrão do giro da câmera.
  features: sift           # orb | sift
  n_features: 3000
  sift_contrast: 0.01      # limiar de contraste do SIFT (padrão 0.04 quase não acha pontos no gramado)
  ratio: 0.75              # teste da razão de Lowe no casamento
  ransac_px: 3.0           # erro máximo (px) de um inlier entre quadros
  min_inliers: 30          # menos que isso = propagação perdida (corte, borrão, campo sem textura)
  keyframe_inliers: 150    # abaixo disso o quadro atual vira o novo quadro-chave
  mask_erode: 15           # px: afasta os pontos da borda do gramado (placas não estão no plano)
  player_margin: 5         # px em volta das caixas dos jogadores
# clip01, 7852 detecções de jogadores de linha casadas com o GT (scripts/evaluate.py team), acurácia por frame:
# RGB/Lab com L: ~0.59 (k-means separa sol de sombra: L varia ±50 no mesmo time); a*b*: 0.989; H-S: 0.994.
# Remover a grama: a*b* 0.870 → 0.989 (a média puxa para o verde); H-S quase não muda (0.992 → 0.994).
# Votação no track inteiro piora (0.961): IDs 12 e 17 trocam de jogador entre times; janela de 1 s → 0.999.
# Árbitro (preto) cai no time verde-branco com qualquer descritor/k (cores neutras em H-S e a*b*).
team:
  torso: [0.2, 0.6, 0.2, 0.8]  # frações [y0, y1, x0, x1] da bbox
  remove_grass: true
  descriptor: hs_hist      # rgb_mean | lab_mean | ab_mean | hs_hist
  hs_bins: [16, 8]
  min_pixels: 20           # recortes com menos pixels não-grama ficam sem rótulo
  calib_frames: 50
  k: 2
  seed: 0
  vote_window_s: 1.0       # moda dos rótulos do mesmo ID a ±1 s (null = track inteiro); 0.25 s: 0.994, 2 s: 0.997
pitch:
  length_m: 105            # FIFA; SoccerNet também assume 105 x 68
  width_m: 68
  px_per_m: 10             # top-view 1050 x 680 (+ margem)
  margin_m: 3
field_mask:
  # clip01: grama ao sol tem pico em H=35-36, torcida amarela em 30-32. h_min=35 ficava no limite: na SNGS-040, 5% do campo
  # tem H=35 e 1-2 níveis de diferença de decodificação já apagavam a área ensolarada (pés de jogadores GT dentro: 0.88).
  # h_min=33 → 0.98 (ajuste 056+040) e 0.977 (validação 054+026); abaixo de 33 não melhora. ExG+Otsu: 0.62 (pior).
  h_range: [33, 85]
  s_min: 40
  v_min: 25               # clip01: 1º percentil do V da grama na sombra = 26 (com 40, 1/3 da sombra sumia)
  morph_kernel: 11         # clip01: com 7, linhas brancas + jogadores separavam pedaços do campo (até 1,2% da imagem); 11 fecha
heatmap:
  cell_m: 0.5              # grade 210 x 136
  sigma_m: 2.0             # desvio do kernel gaussiano em metros (σ em células = sigma_m / cell_m)
  smoothing: spatial       # spatial | frequency
  colormap: inferno
  diff_colormap: RdBu_r    # time 0 − time 1: vermelho = mais time 0, azul = mais time 1
  alpha: 0.85              # opacidade máxima do mapa sobre o campo
  min_player_s: 5.0        # heatmap por jogador só para IDs com >= 5 s de posições (ID curto = fragmento do tracker)
  gamma: 0.5               # clip01: um jogador parado concentra o máximo e o resto do mapa ficava quase transparente
shots:
  small_size: [256, 144]   # quadro reduzido para histograma e gramado (as medidas são globais, não precisam de detalhe)
  hist_bins: [16, 4, 4]    # H x S x V
  cut_thresh: 0.3          # Bhattacharyya entre quadros seguidos; Barça x Real: p99 = 0.19 (movimento normal), cortes de 0.3 a 0.95
  cut_min_frames: 5        # transições de vários quadros contam como um corte só
  board_thresh: 0.8        # correlação com o placar: bimodal (~1.0 com placar, ~0.25 sem), vale entre 0.4 e 0.95
  # tomada da câmera principal ao vivo: gráfico gramado × altura dos jogadores (Barça x Real) tem um grupo
  # isolado com gramado > 0.6, altura 40-80 px e > 8 pessoas; close-ups ficam acima de 150 px
  main_grass_min: 0.5      # mediana da fração de gramado na tomada
  main_height_max: 0.208   # altura mediana das pessoas no quadro central, em fração da altura do quadro (Barça 576p: 120 px)
  main_people_min: 4       # pessoas no gramado no quadro central; Liverpool × City vs. gabarito de câmeras do SoccerNet: 2-5 → revocação 0.987-0.990, precisão 0.963-0.968; 6 → 0.949; 8 → 0.883
  main_board_min: 0.5      # fração dos quadros com placar (sem placar = replay/gráfico)
  probe_min_frames: 15     # tomadas mais curtas não passam pelo YOLO e contam como "outras"
  board_median_frames: 15  # mediana de 0,5 s na presença do placar (piscadas do gráfico não viram corte)
# Partida completa (src/match.py), só as tomadas da câmera principal com homografia marcada.
# 576p em CPU: YOLO 110 ms (imgsz 1280; 960/1024 ~77 ms mas perdem pessoas pequenas em 1 de 5 quadros) + SIFT 130 ms
# por quadro processado. 58 min de câmera principal a 30 fps com step 3 → ~35 mil quadros ≈ 2,4 h.
match:
  frame_step: 3            # 10 Hz: em 0,1 s um jogador anda < 1 m, bem abaixo do σ = 2 m do heatmap
  # lado de cada time (último defensor): Barça × Real, 39 tomadas → 72-79% dos votos para o mesmo time em cada gol;
  # 1º tempo: Real defende a esquerda (confere com o gol do Pedri, 28', no gol da esquerda); 2º tempo: Barça
  gk_zone_m: 6.0           # ignora quem está a menos disso da linha de fundo (goleiro)
  deep_zone_m: 30.0        # só conta quadros com alguém a menos disso do gol (jogo naquele lado)
  min_players: 6           # quadros com menos jogadores visíveis não votam
# Refinamento da homografia pelas linhas brancas (src/lines.py)
lines:
  tophat_px: 15            # elemento do top-hat > largura da linha (~5-10 px em 576p) e < jogador
  tophat_thresh: 25        # L do Lab; no gramado mediana 1-2, p90 4-7; linhas 70-95
  mask_erode: 15           # px: tira a borda do gramado (placas e torcida)
  player_margin: 5
  max_px: 60               # saturação da transformada de distância guardada (uint8)
  stages: [[60, 10.0], [30, 5.0], [10, 2.0]]   # (saturação px, escala do custo robusto px), grosso → fino; 1:85356 +465: só [10, 2] → 0.40, grosso+fino → 0.76
  inlier_px: 2.0           # ponto do modelo "sobre a linha" (fração = qualidade do quadro)
  sample_m: 0.5            # espaçamento dos pontos do modelo
  min_visible: 40          # menos pontos do modelo visíveis = não refina
  prior_weight: 0.05       # peso do deslocamento dos cantos (px) contra o resíduo das linhas
  max_iter: 50
  center_max_resid: 0.01   # marcação entra na estimativa do centro da câmera se r1⟂r2, |r1|=|r2| quase valem (2:55061, quase colinear: 1.6)
  anchor_max_px: 10        # erro mediano dos cliques na câmera PTZ; 27 marcações: 0.6-4.7 px; acima disso a marcação está errada
  min_score: 0.5           # fração mínima dos pontos do modelo sobre as linhas para o quadro entrar no heatmap
  center_min_marks: 5      # marcações com homografia geral antes de a ferramenta passar ao modelo de câmera fixa
